# fly.toml app configuration file generated for pagerio on 2026-09-05T08:25:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pagerio'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  HOSTNAME = '0.0.0.0'
  NODE_ENV = 'production'
  PAGER_DEMO = 'false'
  PAGER_NOTIFICATIONS_ENABLED = 'false'
  PAGER_PAYMENTS_ENABLED = 'false'
  PAGER_PILOT_MODE = 'true'
  PAGER_TELEGRAM_ENABLED = 'false'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
