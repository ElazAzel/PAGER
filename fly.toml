# Replace with the app you create, or pass --app explicitly.
app = "pager-set-your-app-name"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
  PAGER_DEMO = "false"
  PAGER_PILOT_MODE = "true"
  PAGER_PAYMENTS_ENABLED = "false"
  PAGER_NOTIFICATIONS_ENABLED = "false"
  PAGER_TELEGRAM_ENABLED = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
